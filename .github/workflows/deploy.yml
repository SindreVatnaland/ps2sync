name: deploy

on:
  push:
    branches: [main]
    # Docs/deploy-config changes don't affect the image — skip the build.
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - '.gitignore'
  # Manual rebuild (gh workflow run deploy.yml) for when only ignored paths changed.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One native build per architecture (no QEMU — better-sqlite3 + cue2pops compile
  # slowly under emulation). Each pushes its own tag (:arm64 / :x86); the manifest
  # job below stitches them into a multi-arch :latest.
  build:
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: x86
            runner: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository name; the owner login can be mixed-case.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps2sync" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ matrix.arch }}
          # Per-arch layer cache so the two builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: publish :latest (arm64 + x86)
    needs: build
    runs-on: ubuntu-24.04
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into :latest
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps2sync"
          docker buildx imagetools create -t "$img:latest" "$img:arm64" "$img:x86"
          docker buildx imagetools inspect "$img:latest"

      # Best-effort: skipped until DEPLOY_TOKEN is set; never fails the build.
      - name: Trigger redeploy
        if: ${{ env.DEPLOY_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST https://homelab.tailcd7b6f.ts.net/deploy/hooks/redeploy \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"project":"ps2sync"}'
