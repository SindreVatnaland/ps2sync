name: deploy

on:
  push:
    branches: [main]
    # Docs/deploy-config changes don't affect the image — skip the arm64 build.
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - '.gitignore'
  # Manual rebuild (gh workflow run deploy.yml) for when only ignored paths changed.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Native arm64 runner — the image only targets arm64 (Pi 5), so building on
    # arm64 hardware avoids QEMU emulation (the main reason better-sqlite3 +
    # cue2pops were slow to compile). Billed as arm64 minutes on private repos.
    runs-on: ubuntu-24.04-arm
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository name; the owner login can be mixed-case.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ps2sync" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.name }}:latest
          # Layer cache across runs: unchanged stages (cue2pops build, npm deps)
          # restore instead of recompiling. Biggest win after dropping QEMU.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best-effort: skipped until DEPLOY_TOKEN is set; never fails the build.
      - name: Trigger redeploy
        if: ${{ env.DEPLOY_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST https://homelab.tailcd7b6f.ts.net/deploy/hooks/redeploy \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"project":"ps2sync"}'
